# Track B — Sovereign Provider Registry regression manifest.
# Run via: python scripts/run_admissibility_checkpoint.py
# Or: pytest with paths below.

name: sovereign_provider_registry_track_b_regression
description: >
  Sign-off suite for Track B (Sovereign Provider Registry Phases 1–3).
  Failover bridge enforcement, audit envelope, refusal templates, proxy route
  metadata, validation freshness / regression evidence placeholder.

test_paths:
  - tests/test_sovereign_failover_bridge.py
  - tests/test_sovereign_audit_envelope.py
  - tests/test_sovereign_refusal_templates.py
  - tests/test_sovereign_proxy_route_hook.py
  - tests/test_sovereign_validation_freshness.py
  - tests/test_sovereign_provider_registry_regression.py

phases_complete:
  - phase_1_failover_bridge_enforcement
  - phase_2_audit_envelope
  - phase_3a_refusal_templates
  - phase_3b_proxy_route_metadata
  - phase_3c_validation_freshness_regression_evidence

primary_code:
  - aurora_lens/sovereign/
  - aurora_lens/lens.py
  - aurora_lens/proxy/provider_route_hook.py
  - aurora_lens/request_metadata.py

locked_rules:
  - no_silent_failover
  - no_unrecorded_provider_substitution
  - sovereign_routes_require_registry_evaluation
  - adapter_blocked_on_refused_routes

deferred:
  product_phase_3_intake:
    reason: plain-English intake layer not yet built
  live_http_opt_in:
    reason: CI uses mocked HTTP; real endpoints opt-in via AURORA_RUN_LIVE_PROVIDER_REGRESSION

proof_scenario: docs/DEMO_SOVEREIGN_FAILOVER.md
