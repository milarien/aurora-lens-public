schema_version: 1
record_id: phase17-policy-v2
policy_profile: enterprise_strict
mode: offline

questions:
  - id: P17-SUP1
    question: "What contract value now requires manual compliance review?"
    expect: in_context
    record_ids:
      - phase17-policy-v1
      - phase17-policy-v2
    expected_governance_any:
      - N/A
    expected_record_ids_any:
      - phase17-policy-v2
    semantic_assertions:
      must_include_any:
        - "75000"
        - "manual compliance review"
      must_exclude:
        - "50000 USD or more"
      min_any_hits: 2
    citation_expectation:
      required: true
      record_ids_any:
        - phase17-policy-v2
    conflict_expectation:
      governing_record_id: phase17-policy-v2
      superseded_record_ids:
        - phase17-policy-v1
      superseded_version_must_not_drive_answer: true
    notes: "Superseded v1 must not drive conclusion."

