# Model-agnostic: use a cheaper model for testing to save tokens.
upstream:
  provider: openai
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

listen:
  host: 0.0.0.0
  port: 8081

governance:
  policy: strict
  audit_log: ./audit.jsonl

extraction:
  backend: spacy   # default; use llm for higher-fidelity extraction (adds latency)
